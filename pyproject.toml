[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrade-agent"
version = "0.1.0"
description = "QTrade 多实例 IM 控制台 —— Agent(WSL 侧 systemd 服务)。规格 = docs/00 基线 + docs/01~06 六册。"
requires-python = ">=3.11"
dependencies = []
# 运行期(02 §2.2:FastAPI + uvicorn[ws=websockets] + aiosqlite + docker + websockets)在 api/runtime 模块落地时再加;
# 本期骨架(store/adapters.qidian/bus/events)只用标准库,便于在无网络环境单测。

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qtrade_agent.store" = ["*.sql"]
"qtrade_agent.capabilities" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
