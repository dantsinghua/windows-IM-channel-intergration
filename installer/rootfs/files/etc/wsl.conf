# 发行版 qtrade —— WSL 配置(docs/03 §2.7.3 逐条)
[boot]
systemd=true

[user]
# Agent 是 systemd 服务,以 root 跑;交互登录也落 root,排障时不用 sudo。
default=root

[automount]
# 需要读 Windows 侧的暂存目录(安装器经 /mnt/c/ProgramData/QTrade/install/install.env
# 把选定的 docker 段等传进来,见 qtrade-docker-config.sh)。
enabled=true

[interop]
enabled=true
# 🔴 不把 Windows 的 PATH 并进来:并进来之后每次 exec 都要遍历 9p 上的一长串
# Windows 目录,Agent 启动与 adb 调用都会被拖慢(§2.7.3)。
appendWindowsPath=false
